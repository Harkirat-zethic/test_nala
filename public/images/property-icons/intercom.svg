<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Intercom / Communication panel icon -->
  <!-- Main device body -->
  <rect x="20" y="8" width="60" height="84" rx="8" fill="#DBEAF6"/>
  <rect x="20" y="8" width="60" height="84" rx="8" stroke="#5487AE" stroke-width="2.5" fill="none"/>
  <!-- Screen/display area -->
  <rect x="28" y="16" width="44" height="20" rx="4" fill="white" stroke="#5487AE" stroke-width="2"/>
  <!-- Speaker grille -->
  <rect x="28" y="44" width="44" height="24" rx="4" fill="white" stroke="#5487AE" stroke-width="2"/>
  <line x1="34" y1="50" x2="66" y2="50" stroke="#5487AE" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="56" x2="66" y2="56" stroke="#5487AE" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="62" x2="66" y2="62" stroke="#5487AE" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Call button -->
  <circle cx="50" cy="78" r="7" fill="white" stroke="#5487AE" stroke-width="2.2"/>
  <circle cx="50" cy="78" r="3" fill="#5487AE"/>
  <!-- Signal indicator on screen -->
  <path d="M44 22C44 22 47 26 50 26C53 26 56 22 56 22" stroke="#5487AE" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M40 19C40 19 44 28 50 28C56 28 60 19 60 19" stroke="#5487AE" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Sound waves from speaker -->
  <path d="M70 50C73 52 74 55 74 58" stroke="#5487AE" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M74 46C79 50 82 55 82 60" stroke="#5487AE" stroke-width="1.8" stroke-linecap="round" fill="none"/>
</svg>
